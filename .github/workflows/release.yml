name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run all steps except publishing (no release created, no Sigstore production writes)
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # === EXTENSION POINT: pre-release ===
      # Runs before any release-process work begins.
      # State available: none (checkout hasn't happened yet).
      # Use case: cache-warming, "release in progress" notifications.
      # === END EXTENSION POINT ===

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Parse version from tag or input
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            # For dry-run via workflow_dispatch, read from plugin.json
            TAG="v$(jq -r '.version' plugins/kusari/.claude-plugin/plugin.json)"
            echo "::notice::Dry-run mode: using version ${TAG} from plugin.json"
          else
            echo "::error::Release workflow requires a tag push or dry_run=true"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bare=${TAG#v}" >> "$GITHUB_OUTPUT"

          # Detect prerelease
          if [[ "$TAG" =~ -[a-zA-Z0-9.]+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Release version: ${TAG} (prerelease=${{ steps.version.outputs.prerelease || 'false' }})"

      - name: Validate release invariants
        uses: ./.github/actions/release-validate
        with:
          version: ${{ steps.version.outputs.tag }}

      # === EXTENSION POINT: post-version-bump ===
      # Runs after invariant validation passes. Version is known and validated.
      # State available: steps.version.outputs.tag, steps.version.outputs.bare
      # Use case: per-version documentation generation, notification of passing gates.
      # === END EXTENSION POINT ===

      - name: Render release notes from CHANGELOG
        id: notes
        run: |
          bash scripts/release/render-release-notes.sh \
            "${{ steps.version.outputs.tag }}" > release-notes.md
          echo "Release notes rendered ($(wc -l < release-notes.md) lines)"

      - name: Run OpenSSF Baseline audit
        id: audit
        run: |
          # TODO: Replace with actual darnit invocation when available in CI.
          # For now, produce a placeholder audit report that the workflow can gate on.
          # The real implementation will:
          #   1. Run darnit audit → openssf-baseline.json
          #   2. If prior release exists, download its openssf-baseline.json via gh release download
          #   3. Compare: fail if any control regressed or new HIGH/CRITICAL found
          #   4. Bootstrap case (no prior release): skip comparison, check absolute findings only
          echo '{"status": "pass", "controls": [], "findings": [], "note": "placeholder — replace with darnit audit"}' > openssf-baseline.json
          echo "::notice::OpenSSF Baseline audit: placeholder (replace with darnit integration)"

      # Signing and provenance
      # NOTE: Full SLSA L3 provenance via slsa-github-generator requires a
      # reusable-workflow call which must be a separate job. For the initial
      # implementation, we use GitHub's built-in attestation action as a
      # pragmatic starting point. Migration to slsa-github-generator is a
      # planned follow-up that lands at the post-release-marker extension point.

      - name: Compute release subject digests
        id: digests
        run: |
          echo "audit_sha256=$(sha256sum openssf-baseline.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          # Source tree hash of plugins/kusari/ at this commit
          echo "tree_hash=$(git rev-parse HEAD:plugins/kusari)" >> "$GITHUB_OUTPUT"

      - name: Sign release tag
        if: inputs.dry_run != 'true'
        run: |
          echo "::notice::Tag signing via cosign will be configured when Sigstore keyless flow is set up."
          echo "Placeholder: cosign sign --yes refs/tags/${{ steps.version.outputs.tag }}"
          # TODO: Uncomment when cosign is installed and OIDC identity is configured:
          # cosign sign --yes "refs/tags/${{ steps.version.outputs.tag }}"
          echo '{"signed": true, "tag": "${{ steps.version.outputs.tag }}", "note": "placeholder"}' > "${{ steps.version.outputs.tag }}.sig"

      - name: Generate provenance attestation
        if: inputs.dry_run != 'true'
        run: |
          echo "::notice::SLSA provenance generation placeholder — replace with slsa-github-generator reusable workflow call."
          # TODO: Migrate to slsa-framework/slsa-github-generator call
          echo '{"_type": "https://in-toto.io/Statement/v1", "predicateType": "https://slsa.dev/provenance/v1", "note": "placeholder"}' > "${{ steps.version.outputs.tag }}.intoto.jsonl"

      # === EXTENSION POINT: post-release-marker ===
      # Runs after signature and provenance are issued but BEFORE the GitHub
      # Release entry is created. Sigstore transparency log entries are
      # append-only — failures here do NOT retract the signature.
      # State available: sbom.spdx.json, openssf-baseline.json, *.sig, *.intoto.jsonl
      # Use case: cross-registry publishing, secondary attestation stores.
      # === END EXTENSION POINT ===

      - name: Create GitHub Release
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            openssf-baseline.json \
            "${{ steps.version.outputs.tag }}.intoto.jsonl" \
            "${{ steps.version.outputs.tag }}.sig"

          echo "::notice::Release ${{ steps.version.outputs.tag }} published"

      - name: Upload dry-run artifacts
        if: inputs.dry_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ steps.version.outputs.tag }}
          path: |
            release-notes.md
            openssf-baseline.json
          retention-days: 7

      # === EXTENSION POINT: post-publish ===
      # Runs after the GitHub Release is live (or after dry-run artifact upload).
      # State available: everything above + the published release URL.
      # Use case: announcements, cache invalidation, documentation site rebuilds.
      # === END EXTENSION POINT ===

      - name: Summary
        run: |
          echo "### Release ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "**Mode**: Dry run (no artifacts published)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Mode**: Published" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Baseline audit | $(jq -r '.status' openssf-baseline.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prerelease | ${{ steps.version.outputs.prerelease }} |" >> "$GITHUB_STEP_SUMMARY"
